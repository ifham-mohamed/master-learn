# Paid web service + persistent disk. Review pricing before creating the Blueprint.
services:
  - type: web
    name: master-learn
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:hosted
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    disk:
      name: google-sessions
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GOOGLE_SESSION_DIR
        value: /var/data/google-sessions
      - key: APP_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SESSION_KEY
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
